<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212; /* Fond noir */
            color: #ffffff; /* Texte blanc */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #ffa500; /* Couleur orange */
        }

        header button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffa500; /* Bouton orange */
            color: #121212; /* Texte noir */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        header button:hover {
            background-color: #ff8c00; /* Orange plus foncé */
        }

        main {
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        form input, form button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ffa500; /* Bordures orange */
            background-color: #1e1e1e; /* Champ sombre */
            color: #ffffff; /* Texte blanc */
        }

        form button {
            background-color: #ffa500; /* Bouton orange */
            color: #121212; /* Texte noir */
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        form button:hover {
            background-color: #ff8c00; /* Orange plus foncé */
        }

        #serviceList {
            margin-top: 20px;
        }

        .service {
            background-color: #1e1e1e; /* Fond sombre */
            border: 1px solid #ffa500; /* Bordures orange */
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            color: #ffffff; /* Texte blanc */
        }

        .service p {
            margin: 5px 0;
        }

        .service button {
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .service .edit-service {
            background-color: #ffa500; /* Bouton orange */
            color: #121212; /* Texte noir */
            margin-right: 10px;
        }

        .service .edit-service:hover {
            background-color: #ff8c00; /* Orange plus foncé */
        }

        .service .delete-service {
            background-color: #dc3545; /* Rouge suppression */
            color: #ffffff;
        }

        .service .delete-service:hover {
            background-color: #b02a37; /* Rouge foncé */
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestion des Services</h1>
        <button onclick="location.href='index.html'">Retour au Menu</button>
    </header>

    <main>
        <form id="addServiceForm">
            <input type="text" placeholder="Nom du service" id="nomService" required>
            <input type="number" placeholder="Prix (€)" id="prixService" required>
            <button type="submit">Ajouter Service</button>
        </form>
        <div id="serviceList"></div>
    </main>

    <script>
        // Gestion des services : ajout, modification et suppression
        const serviceList = document.getElementById("serviceList");
        document.getElementById("addServiceForm").addEventListener("submit", function (e) {
            e.preventDefault();

            // Récupération des champs
            const nom = document.getElementById("nomService").value;
            const prix = document.getElementById("prixService").value;

            // Création d'un nouveau service
            const serviceDiv = document.createElement("div");
            serviceDiv.className = "service";

            serviceDiv.innerHTML = `
                <p>Nom du service: <span class="service-nom">${nom}</span></p>
                <p>Prix: €<span class="service-prix">${prix}</span></p>
                <button class="edit-service">Modifier</button>
                <button class="delete-service">Supprimer</button>
            `;

            serviceList.appendChild(serviceDiv);

            // Reset du formulaire
            e.target.reset();

            // Ajout des actions Modifier et Supprimer
            addEditAndDeleteListeners(serviceDiv);
            alert("Service ajouté avec succès !");
        });

        function addEditAndDeleteListeners(serviceDiv) {
            // Suppression
            serviceDiv.querySelector(".delete-service").addEventListener("click", function () {
                if (confirm("Voulez-vous vraiment supprimer ce service ?")) {
                    serviceDiv.remove();
                }
            });

            // Modification
            serviceDiv.querySelector(".edit-service").addEventListener("click", function () {
                const nom = serviceDiv.querySelector(".service-nom");
                const prix = serviceDiv.querySelector(".service-prix");

                // Demander de nouvelles valeurs
                const newNom = prompt("Modifier le nom du service :", nom.textContent);
                const newPrix = prompt("Modifier le prix (€) :", prix.textContent);

                // Mise à jour des valeurs
                if (newNom) nom.textContent = newNom;
                if (newPrix) prix.textContent = newPrix;

                alert("Service modifié avec succès !");
            });
        }
    </script>
</body>
</html>
