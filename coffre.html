<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffre-fort et Taxes</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: #ffa500;
            font-weight: bold;
        }

        #safe {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-bottom: 30px;
        }

        #safe p {
            font-size: 2em;
            margin: 10px 0;
            color: #ffa500;
        }

        #safe button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffa500;
            color: #121212;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease-in-out;
        }

        #safe button:hover {
            background-color: #ff8c00;
            transform: scale(1.1);
        }

        #backButton {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #ffa500;
            color: #121212;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease-in-out;
            margin-top: 20px;
        }

        #backButton:hover {
            background-color: #ff8c00;
            transform: scale(1.1);
        }

        main {
            width: 100%;
            max-width: 900px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        form input, form button {
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ffa500;
            background-color: #1e1e1e;
            color: #ffffff;
        }

        form button {
            background-color: #ffa500;
            color: #121212;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease-in-out;
        }

        form button:hover {
            background-color: #ff8c00;
            transform: scale(1.05);
        }

        #taxList {
            margin-top: 20px;
        }

        .tax {
            background-color: #1e1e1e;
            border: 1px solid #ffa500;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tax p {
            margin: 0;
        }

        .tax button {
            padding: 10px 20px;
            margin-left: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .paid {
            background-color: #28a745;
            color: white;
        }

        .in-progress {
            background-color: #ffc107;
            color: black;
        }

        .unpaid {
            background-color: #dc3545;
            color: white;
        }

        .tax-status button {
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestion du Coffre-fort et Taxes</h1>
        <button id="backButton" onclick="window.location.href='index.html'">Retour au Menu</button>
    </header>

    <div id="safe">
        <p id="safeAmount">Montant dans le coffre: €<span id="amount">0</span></p>
        <button id="updateSafeButton">Modifier le montant</button>
    </div>

    <main>
        <form id="addTaxForm">
            <input type="text" id="taxName" placeholder="Nom de l'entreprise" required>
            <input type="number" id="taxAmount" placeholder="Montant (€)" required>
            <button type="submit">Ajouter Taxe</button>
        </form>

        <div id="taxList"></div>
    </main>

    <script>
        const safeAmount = document.getElementById("amount");
        const updateSafeButton = document.getElementById("updateSafeButton");

        updateSafeButton.addEventListener("click", () => {
            const newAmount = prompt("Entrez le nouveau montant dans le coffre (€):", safeAmount.textContent);
            if (newAmount !== null && !isNaN(newAmount)) {
                safeAmount.textContent = newAmount;
                alert("Montant mis à jour !");
            }
        });

        const taxList = document.getElementById("taxList");
        const addTaxForm = document.getElementById("addTaxForm");

        addTaxForm.addEventListener("submit", (e) => {
            e.preventDefault();

            const taxName = document.getElementById("taxName").value;
            const taxAmount = document.getElementById("taxAmount").value;

            const taxDiv = document.createElement("div");
            taxDiv.className = "tax";
            taxDiv.innerHTML = `
                <p>${taxName}: €${taxAmount}</p>
                <div class="tax-status">
                    <button class="unpaid">Non payé</button>
                </div>
            `;

            const statusButton = taxDiv.querySelector(".tax-status button");
            statusButton.addEventListener("click", () => {
                if (statusButton.classList.contains("unpaid")) {
                    statusButton.className = "paid";
                    statusButton.textContent = "Payé";
                } else if (statusButton.classList.contains("paid")) {
                    statusButton.className = "in-progress";
                    statusButton.textContent = "En cours";
                } else {
                    statusButton.className = "unpaid";
                    statusButton.textContent = "Non payé";
                }
            });

            taxList.appendChild(taxDiv);
            addTaxForm.reset();
        });
    </script>
</body>
</html>
